[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=9.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "buhito"
dynamic = ["version"]
description = "buhito is a Python library for graph analysis and machine learning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "BSD 3-Clause License" }

authors = [
    { name = "Buhito Developers", email = "un_graphlets@lanl.gov" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "numpy>=1.21.0,<2.0",
    "networkx>=2.8.0,<3.0",
    "pandas>=1.5.0,<2.0",
    "scikit-learn>=1.2.0,<2.0",
    "scipy>=1.9.0,<2.0",
    "numba>=0.56.0,<1.0",
    "joblib>=1.2.0,<2.0",
    "tqdm>=4.64.0,<5.0",
    "matplotlib>=3.6.0,<4.0",
    "pillow>=9.0.0,<10.0",
    "pydot>=4.0.1,<5.0",
]

[project.urls]
Homepage = "https://github.com/lanl/buhito"
"Bug Tracker" = "https://github.com/lanl/buhito/issues"
"Source Code" = "https://github.com/lanl/buhito"

[project.optional-dependencies]
ml = [
    "flaml>=2.6,<3",
    "lightgbm>=4.7,<5",
    "seaborn>=0.13,<1",
    "sigfig>=1.3,<2",
    "sparse>=0.13",
    "dask[array]>=2023.1",
    "distributed>=2023.1",
]
demos = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "nbconvert>=7,<8",
    "graphviz",
]
docs = [
    "sphinx>=8.0",
    "sphinx_rtd_theme>=3.0.0rc1",
    "sphinxcontrib-bibtex>=2.6",
]

test = [
    "pytest>=8.3,<10.0",
]

full = [
    "graphviz",
    "triton",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
